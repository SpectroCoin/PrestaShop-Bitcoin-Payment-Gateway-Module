# Tier 2: a real PrestaShop, and a stand-in SpectroCoin API that answers as
# spectrocoin.com inside this network.
#
# That network alias is the point of the design: the module reaches the stub
# through its own shipped Config URLs, over real TLS, with no test-only edit to
# the code under test.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: prestashop
    healthcheck:
      # Asserts the DATABASE exists, not merely that the server answers:
      # PrestaShop's installer fails once on "Unknown database" and never retries.
      test: ["CMD-SHELL", "mariadb -uroot -proot -e 'USE prestashop' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  spectrocoin:
    build:
      context: ./stub
    networks:
      default:
        aliases:
          - spectrocoin.com
    volumes:
      - ./.certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/__test/requests"]
      interval: 5s
      timeout: 5s
      retries: 30

  prestashop:
    image: prestashop/prestashop:8-apache
    depends_on:
      db:
        condition: service_healthy
      spectrocoin:
        condition: service_healthy
    networks:
      default:
        # The module rejects a callbackUrl whose host has no dot, and that URL
        # is built from the shop domain - so the shop cannot be "localhost".
        aliases:
          - shop.test
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: root
      PS_INSTALL_AUTO: 1
      # NB: do NOT set PS_ERASE_DB. It drops the database during install and the
      # installer then dies on "Unknown database", leaving the shop uninstalled.
      PS_DEV_MODE: 1
      PS_DOMAIN: shop.test
      PS_FOLDER_ADMIN: admintier2
      PS_FOLDER_INSTALL: install
      ADMIN_MAIL: tier2@example.com
      ADMIN_PASSWD: tier2tier2
    volumes:
      - ./.certs:/certs:ro
    ports:
      - "8087:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 120s
